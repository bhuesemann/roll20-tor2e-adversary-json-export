name: "Build"
# https://www.dotnetcurry.com/dotnetcore/github-actions-for-dotnet-developers
on:
  push:
    tags:
      - '[0-9]+.[0-9]+.[0-9]+' # Push events to matching v*, i.e. v1.0, v20.15.10
    paths-ignore:
      - '**/*.md'
      - '**/*.gitignore'
      - '**/*.gitattributes'
jobs:
  build:
    name: Build 
    runs-on: windows-latest
    permissions:
      contents: write
    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: 1
      DOTNET_SKIP_FIRST_TIME_EXPERIENCE: 1
      DOTNET_NOLOGO: true
      DOTNET_GENERATE_ASPNET_CERTIFICATE: false
      DOTNET_ADD_GLOBAL_TOOLS_TO_PATH: false
      DOTNET_MULTILEVEL_LOOKUP: 0
      DOTNET_SYSTEM_CONSOLE_ALLOW_ANSI_COLOR_REDIRECTION: true
      TERM: xterm

    steps:
    - uses: actions/checkout@v4
      
    - name: Setup .NET Core SDK
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: 10.0.x

    - uses: actions/cache@v4
      with:
        path: ~/.nuget/packages
        key: ${{ runner.os }}-nuget-${{ hashFiles('**/*.csproj') }}
        restore-keys: |
          ${{ runner.os }}-nuget-

    - name: Restore
      run: dotnet restore

    - name: Build
      run: dotnet build --configuration Release --no-restore

    - name: dotnet publish
      run: dotnet publish -c Release --property:PublishDir="${{ github.workspace }}/dist" -p:PublishProfile=Release

    - name: Upload artifact for deployment job
      uses: actions/upload-artifact@v4
      with:
        name: roll20-tor2e-adversary-json-export
        path: "${{ github.workspace }}/dist"

    - name: Extract release notes
      id: extract-release-notes
      uses: ffurrer2/extract-release-notes@v2

    - name: Read Releasenr
      id: releasenr
      shell: bash
      run: echo "version=$(cat RELEASE)" >> "$GITHUB_OUTPUT"

    - name: Archive Release
      shell: pwsh
      run: Compress-Archive -Path "${{ github.workspace }}/dist/*" -DestinationPath "roll20-tor2e-adversary-json-export.${{ steps.releasenr.outputs.version }}.zip"

    - name: Create Release
      shell: bash
      env:
        GH_TOKEN: ${{ github.token }}
        VERSION: ${{ steps.releasenr.outputs.version }}
        RELEASE_NOTES: ${{ steps.extract-release-notes.outputs.release_notes }}
      run: |
        printf '%s\n' "$RELEASE_NOTES" > release-notes.md
        gh release create "$VERSION" "roll20-tor2e-adversary-json-export.$VERSION.zip" \
          --title "Release $VERSION" \
          --notes-file release-notes.md \
          --prerelease
